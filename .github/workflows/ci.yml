name: CI

on:
  push:
    branches: [ dev, master ]
  pull_request:
    branches: [ dev, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_DB: dataturntable
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    services:
      zookeeper:
        image: confluentinc/cp-zookeeper:7.4.0
        env:
          ZOOKEEPER_CLIENT_PORT: 2181
        ports:
          - 2181:2181
        options: >-
          --health-cmd="curl -sSf http://localhost:2181 || exit 1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      kafka:
        image: confluentinc/cp-kafka:7.4.0
        env:
          KAFKA_BROKER_ID: 1
          KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
          KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:9092
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
        ports:
          - 9092:9092
        options: >-
          --health-cmd="/bin/bash -c 'echo > /dev/tcp/127.0.0.1/9092' || exit 1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      CONNECTOR_CONFIG_KEY: 'AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA='
      QUARKUS_DATASOURCE_JDBC_URL: 'jdbc:postgresql://127.0.0.1:5432/dataturntable'
      QUARKUS_DATASOURCE_USERNAME: 'postgres'
      QUARKUS_DATASOURCE_PASSWORD: 'postgres'
      KAFKA_BOOTSTRAP_SERVERS: '127.0.0.1:9092'
      REDIS_HOSTS: 'redis://127.0.0.1:6379'

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-

      - name: Wait for services
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client netcat
          until pg_isready -h 127.0.0.1 -p 5432 -U postgres; do sleep 1; done
          until echo > /dev/tcp/127.0.0.1/9092; do sleep 1; done
          until redis-cli -h 127.0.0.1 ping | grep -q PONG; do sleep 1; done
        env:
          PGPASSWORD: postgres

      - name: Run Maven tests
        run: mvn -B -e -DskipTests=false test
        working-directory: backend
