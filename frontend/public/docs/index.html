<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DataTurntable Documentation</title>
    <meta name="description" content="DataTurntable standalone user documentation" />
    <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css" />
    <link rel="stylesheet" href="/docs/theme.css" />
  </head>
  <body>
    <div id="app">Loading docs...</div>
    <script>
      window.$docsify = {
        name: 'DataTurntable Docs',
        repo: '',
        loadSidebar: true,
        loadNavbar: true,
        subMaxLevel: 3,
        auto2top: true,
        homepage: 'README.md',
        alias: {
          '/de/_sidebar.md': '/de/_sidebar.md',
          '/de/.*/_sidebar.md': '/de/_sidebar.md',
          '/_sidebar.md': '/_sidebar.md',
          '/de/_navbar.md': '/de/_navbar.md',
          '/de/.*/_navbar.md': '/de/_navbar.md',
          '/_navbar.md': '/_navbar.md'
        },
        search: {
          depth: 4,
          maxAge: 86400000,
          placeholder: 'Search docs',
          noData: 'No results found'
        }
      };
    </script>
    <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
    <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/docsify-copy-code@2"></script>
  </body>
</html>
