<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DataTurntable Docs</title>
    <link rel="stylesheet" href="/docs/styles.css" />
  </head>
  <body>
    <header class="hero">
      <div class="container">
        <div class="hero-top">
          <h1 id="title"></h1>
          <select id="lang" aria-label="Language selector">
            <option value="en">English</option>
            <option value="de">Deutsch</option>
          </select>
        </div>
        <p id="subtitle"></p>
        <p id="updated" class="muted"></p>
      </div>
    </header>

    <main class="container">
      <section class="panel">
        <h2 id="quickLinksTitle"></h2>
        <div id="quickLinks" class="chips"></div>
      </section>

      <section id="sections" class="grid"></section>

      <section class="panel">
        <h2 id="faqTitle"></h2>
        <div id="faq"></div>
      </section>
    </main>

    <footer class="container footer">
      <p>Repository manuals: <code>docs/user/en/user-guide.md</code> and <code>docs/user/de/benutzerhandbuch.md</code></p>
    </footer>

    <script src="/docs/app.js"></script>
  </body>
</html>
