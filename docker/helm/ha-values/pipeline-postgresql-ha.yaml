global:
  storageClass: standard

postgresql:
  username: pipeline_data
  password: pipeline_data
  database: pipeline_data
  repmgrPassword: repmgr-secret
  postgresPassword: postgres-admin
  replicaCount: 3
  syncReplication: true
  resources:
    requests:
      cpu: 750m
      memory: 2Gi
    limits:
      cpu: 3
      memory: 8Gi
  persistence:
    size: 200Gi

pgpool:
  replicaCount: 2
  adminPassword: admin
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1
      memory: 2Gi
