global:
  storageClass: standard

postgresql:
  username: dataturntable
  password: dataturntable
  database: dataturntable
  repmgrPassword: repmgr-secret
  postgresPassword: postgres-admin
  replicaCount: 3
  syncReplication: true
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 2
      memory: 4Gi
  persistence:
    size: 50Gi

pgpool:
  replicaCount: 2
  adminPassword: admin
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1
      memory: 2Gi
