global:
  storageClass: standard

postgresql:
  username: monitoring
  password: monitoring
  database: monitoring
  repmgrPassword: repmgr-secret
  postgresPassword: postgres-admin
  replicaCount: 3
  syncReplication: true
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1
      memory: 2Gi
  persistence:
    size: 30Gi

pgpool:
  replicaCount: 2
  adminPassword: admin
