apiVersion: apps/v1
kind: Deployment
metadata:
  name: dataturntable-control-api
spec:
  template:
    spec:
      containers:
        - name: control-api
          env:
            - name: DB_HOST
              value: app-db-ha-postgresql-ha-pgpool
            - name: DATATURNTABLE_PIPELINE_DATA_JDBC_URL
              value: jdbc:postgresql://pipeline-db-ha-postgresql-ha-pgpool:5432/pipeline_data
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: kafka-ha:9092
            - name: REDIS_HOSTS
              value: redis://redis-ha-master:6379
            - name: DATATURNTABLE_GRAFANA_DASHBOARD_DATASOURCE_HOST
              value: pipeline-db-ha-postgresql-ha-pgpool
