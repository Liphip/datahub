configs:
  nginx_cfg:
    file: ./nginx.conf
  frontend_nginx_cfg:
    file: ./frontend-nginx.conf

volumes:
  pgdata:
  kafka-data:
  redis-data:
  mosquitto-data:
  mosquitto-logs:

networks:
  dataturntable:
    external: true

services:
  postgresql:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: dataturntable
      POSTGRES_PASSWORD: dataturntable
      POSTGRES_DB: dataturntable
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - dataturntable
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - dataturntable
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    networks:
      - dataturntable
    deploy:
      replicas: 1

  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - target: 1883
        published: 1883
        protocol: tcp
        mode: ingress
      - target: 9001
        published: 9001
        protocol: tcp
        mode: ingress
    volumes:
      - mosquitto-data:/mosquitto/data
      - mosquitto-logs:/mosquitto/log
    networks:
      - dataturntable
    deploy:
      replicas: 1

  backend:
    image: dataturntable/backend:latest
    environment:
      DB_HOST: postgresql
      DB_PORT: 5432
      DB_NAME: dataturntable
      DB_USER: dataturntable
      DB_PASSWORD: dataturntable
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      REDIS_HOSTS: redis://redis:6379
    ports:
      - target: 8080
        published: 8080
        protocol: tcp
        mode: ingress
    networks:
      - dataturntable
    deploy:
      replicas: 3
      update_config:
        parallelism: 1
        delay: 10s
      restart_policy:
        condition: on-failure

  frontend:
    image: dataturntable/frontend:latest
    configs:
      - source: frontend_nginx_cfg
        target: /etc/nginx/conf.d/default.conf
    networks:
      - dataturntable
    deploy:
      replicas: 3
      update_config:
        parallelism: 1
        delay: 10s
      restart_policy:
        condition: on-failure

  docs:
    image: dataturntable/docs:latest
    networks:
      - dataturntable
    deploy:
      replicas: 2
      update_config:
        parallelism: 1
        delay: 10s
      restart_policy:
        condition: on-failure

  nginx:
    image: nginx:alpine
    configs:
      - source: nginx_cfg
        target: /etc/nginx/conf.d/default.conf
    ports:
      - target: 80
        published: 80
        protocol: tcp
        mode: ingress
    networks:
      - dataturntable
    deploy:
      replicas: 2
      update_config:
        parallelism: 1
        delay: 10s
