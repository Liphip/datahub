configs:
  nginx_cfg:
    file: ./nginx.conf
  frontend_nginx_cfg:
    file: ./frontend-nginx.conf

volumes:
  pgdata:
  pipeline-pgdata:
  monitoring-pgdata:
  dashboard-pgdata:
  kafka-data:
  redis-data:
  mosquitto-data:
  mosquitto-logs:
  grafana-data:
  dashboard-grafana-data:

networks:
  dataturntable:
    external: true

services:
  postgresql:
    # TODO: Pin production stack images to immutable releases
    # Details: This stack uses floating database, application, and documentation tags. Use one version or digest per release across all services so deployments, rollbacks, and incident investigations are reproducible.
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: dataturntable
      POSTGRES_PASSWORD: dataturntable
      POSTGRES_DB: dataturntable
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - dataturntable
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager

  pipeline-postgresql:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: pipeline_data
      POSTGRES_PASSWORD: pipeline_data
      POSTGRES_DB: pipeline_data
    volumes:
      - pipeline-pgdata:/var/lib/postgresql/data
    networks:
      - dataturntable
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager

  monitoring-postgresql:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: monitoring
      POSTGRES_PASSWORD: monitoring
      POSTGRES_DB: monitoring
    volumes:
      - monitoring-pgdata:/var/lib/postgresql/data
    networks:
      - dataturntable
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager

  dashboard-postgresql:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dashboard
      POSTGRES_PASSWORD: dashboard
      POSTGRES_DB: dashboard
    volumes:
      - dashboard-pgdata:/var/lib/postgresql/data
    networks:
      - dataturntable
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - dataturntable
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    networks:
      - dataturntable
    deploy:
      replicas: 1

  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - target: 1883
        published: 1883
        protocol: tcp
        mode: ingress
      - target: 9001
        published: 9001
        protocol: tcp
        mode: ingress
    volumes:
      - mosquitto-data:/mosquitto/data
      - mosquitto-logs:/mosquitto/log
    networks:
      - dataturntable
    deploy:
      replicas: 1

  control-api:
    image: dataturntable/backend:latest
    environment:
      QUARKUS_PROFILE: prod,control-api
      DATATURNTABLE_RUNTIME_ROLE: control-api
      DB_HOST: postgresql
      DB_PORT: 5432
      DB_NAME: dataturntable
      DB_USER: dataturntable
      DB_PASSWORD: dataturntable
      DATATURNTABLE_PIPELINE_DATA_JDBC_URL: jdbc:postgresql://pipeline-postgresql:5432/pipeline_data
      DATATURNTABLE_PIPELINE_DATA_JDBC_USERNAME: pipeline_data
      DATATURNTABLE_PIPELINE_DATA_JDBC_PASSWORD: pipeline_data
      DATATURNTABLE_GRAFANA_DASHBOARD_ENABLED: "true"
      DATATURNTABLE_GRAFANA_DASHBOARD_BASE_URL: http://dashboard-grafana:3000
      DATATURNTABLE_GRAFANA_DASHBOARD_ADMIN_USER: admin
      DATATURNTABLE_GRAFANA_DASHBOARD_ADMIN_PASSWORD: admin
      DATATURNTABLE_GRAFANA_DASHBOARD_DATASOURCE_HOST: pipeline-postgresql
      DATATURNTABLE_GRAFANA_DASHBOARD_DATASOURCE_PORT: 5432
      DATATURNTABLE_GRAFANA_DASHBOARD_DATASOURCE_DATABASE: pipeline_data
      DATATURNTABLE_GRAFANA_DASHBOARD_DATASOURCE_USER: pipeline_data
      DATATURNTABLE_GRAFANA_DASHBOARD_DATASOURCE_PASSWORD: pipeline_data
      DATATURNTABLE_GRAFANA_MONITORING_ENABLED: "true"
      DATATURNTABLE_GRAFANA_MONITORING_BASE_URL: http://grafana:3000
      DATATURNTABLE_GRAFANA_MONITORING_ADMIN_USER: admin
      DATATURNTABLE_GRAFANA_MONITORING_ADMIN_PASSWORD: admin
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      REDIS_HOSTS: redis://redis:6379
    ports:
      - target: 8080
        published: 8080
        protocol: tcp
        mode: ingress
    networks:
      - dataturntable
    deploy:
      replicas: 2
      update_config:
        parallelism: 1
        delay: 10s
      restart_policy:
        condition: on-failure

  public-api:
    image: dataturntable/backend:latest
    environment:
      QUARKUS_PROFILE: prod,public-api
      DATATURNTABLE_RUNTIME_ROLE: public-api
      DB_HOST: postgresql
      DB_PORT: 5432
      DB_NAME: dataturntable
      DB_USER: dataturntable
      DB_PASSWORD: dataturntable
      DATATURNTABLE_PIPELINE_DATA_JDBC_URL: jdbc:postgresql://pipeline-postgresql:5432/pipeline_data
      DATATURNTABLE_PIPELINE_DATA_JDBC_USERNAME: pipeline_data
      DATATURNTABLE_PIPELINE_DATA_JDBC_PASSWORD: pipeline_data
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      REDIS_HOSTS: redis://redis:6379
    networks:
      - dataturntable
    deploy:
      replicas: 2
      update_config:
        parallelism: 1
        delay: 10s
      restart_policy:
        condition: on-failure

  ingest-edge:
    image: dataturntable/backend:latest
    environment:
      QUARKUS_PROFILE: prod,ingest-edge
      DATATURNTABLE_RUNTIME_ROLE: ingest-edge
      DB_HOST: postgresql
      DB_PORT: 5432
      DB_NAME: dataturntable
      DB_USER: dataturntable
      DB_PASSWORD: dataturntable
      DATATURNTABLE_PIPELINE_DATA_JDBC_URL: jdbc:postgresql://pipeline-postgresql:5432/pipeline_data
      DATATURNTABLE_PIPELINE_DATA_JDBC_USERNAME: pipeline_data
      DATATURNTABLE_PIPELINE_DATA_JDBC_PASSWORD: pipeline_data
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      REDIS_HOSTS: redis://redis:6379
    networks:
      - dataturntable
    deploy:
      replicas: 2
      update_config:
        parallelism: 1
        delay: 10s
      restart_policy:
        condition: on-failure

  pipeline-executor:
    # BUG: Pipeline executor has no Docker runtime access
    # Details: DockerService runs module containers through the Docker CLI, but this Swarm service has neither a mounted Docker socket nor a configured remote daemon. Provision a controlled runner or use Swarm-native task execution before enabling pipelines.
    image: dataturntable/backend:latest
    environment:
      QUARKUS_PROFILE: prod,pipeline-executor
      DATATURNTABLE_RUNTIME_ROLE: pipeline-executor
      DB_HOST: postgresql
      DB_PORT: 5432
      DB_NAME: dataturntable
      DB_USER: dataturntable
      DB_PASSWORD: dataturntable
      DATATURNTABLE_PIPELINE_DATA_JDBC_URL: jdbc:postgresql://pipeline-postgresql:5432/pipeline_data
      DATATURNTABLE_PIPELINE_DATA_JDBC_USERNAME: pipeline_data
      DATATURNTABLE_PIPELINE_DATA_JDBC_PASSWORD: pipeline_data
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      REDIS_HOSTS: redis://redis:6379
    networks:
      - dataturntable
    deploy:
      replicas: 2
      update_config:
        parallelism: 1
        delay: 10s
      restart_policy:
        condition: on-failure

  frontend:
    image: dataturntable/frontend:latest
    configs:
      - source: frontend_nginx_cfg
        target: /etc/nginx/conf.d/default.conf
    networks:
      - dataturntable
    deploy:
      replicas: 3
      update_config:
        parallelism: 1
        delay: 10s
      restart_policy:
        condition: on-failure

  docs:
    image: dataturntable/docs:latest
    networks:
      - dataturntable
    deploy:
      replicas: 2
      update_config:
        parallelism: 1
        delay: 10s
      restart_policy:
        condition: on-failure

  dashboard-grafana:
    image: grafana/grafana:11.1.4
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s/dashboard/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_DATABASE_TYPE: postgres
      GF_DATABASE_HOST: dashboard-postgresql:5432
      GF_DATABASE_NAME: dashboard
      GF_DATABASE_USER: dashboard
      GF_DATABASE_PASSWORD: dashboard
    volumes:
      - dashboard-grafana-data:/var/lib/grafana
    networks:
      - dataturntable
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
        delay: 10s
      restart_policy:
        condition: on-failure

  grafana:
    image: grafana/grafana:11.1.4
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DATABASE_TYPE: postgres
      GF_DATABASE_HOST: monitoring-postgresql:5432
      GF_DATABASE_NAME: monitoring
      GF_DATABASE_USER: monitoring
      GF_DATABASE_PASSWORD: monitoring
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - dataturntable
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
        delay: 10s
      restart_policy:
        condition: on-failure

  nginx:
    image: nginx:alpine
    configs:
      - source: nginx_cfg
        target: /etc/nginx/conf.d/default.conf
    ports:
      - target: 80
        published: 80
        protocol: tcp
        mode: ingress
    networks:
      - dataturntable
    deploy:
      replicas: 2
      update_config:
        parallelism: 1
        delay: 10s
