# Optional local Keycloak provider. Combine with compose.desktop.yml.
services:
  backend:
    environment:
      DATATURNTABLE_OIDC_ENABLED: "true"
      DATATURNTABLE_OIDC_ISSUER: http://idp.localhost:8180/realms/dataturntable
      DATATURNTABLE_OIDC_CLIENT_ID: dataturntable
    depends_on:
      keycloak: {condition: service_healthy}
  keycloak:
    image: quay.io/keycloak/keycloak:26.6.2
    entrypoint: [/bin/bash, -ec]
    command:
      - |
        read -r KC_BOOTSTRAP_ADMIN_PASSWORD < /opt/keycloak/data/import/admin-password
        export KC_BOOTSTRAP_ADMIN_PASSWORD
        exec /opt/keycloak/bin/kc.sh start-dev --import-realm --http-port=8180 --hostname=http://idp.localhost:8180 --health-enabled=true
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: desktop-admin
    ports: ["127.0.0.1:8180:8180"]
    networks:
      default:
        aliases: [idp.localhost]
    volumes:
      - idp-import:/opt/keycloak/data/import:ro
      - keycloak-data:/opt/keycloak/data
    depends_on:
      init: {condition: service_completed_successfully}
    healthcheck:
      test:
        - CMD
        - /bin/bash
        - -ec
        - "exec 3<>/dev/tcp/127.0.0.1/9000; printf 'GET /health/ready HTTP/1.0\r\n\r\n' >&3; read -r status <&3; [[ $$status == *'200'* ]]"
      interval: 10s
      timeout: 5s
      retries: 40
      start_period: 60s
    restart: unless-stopped
volumes:
  keycloak-data:
