# Docker DNS keeps routes current when Compose replaces application containers.
resolver 127.0.0.11 valid=5s ipv6=off;
upstream desktop_backend { zone desktop_backend 64k; server backend:8080 resolve; }
upstream desktop_frontend { zone desktop_frontend 64k; server frontend:80 resolve; }
upstream desktop_docs { zone desktop_docs 64k; server docs:80 resolve; }
upstream desktop_dashboard { zone desktop_dashboard 64k; server dashboard:3000 resolve; }

upstream desktop_monitoring { zone desktop_monitoring 64k; server monitoring:3000 resolve; }

server {
    listen 80;
    large_client_header_buffers 4 16k;
    server_name localhost;
    client_max_body_size 1m;
    location = /health { return 200 'ready\n'; add_header Content-Type text/plain; }
    location /api/ {
        # OIDC providers can return several encrypted token-state cookies.
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
        proxy_busy_buffers_size 32k;
        proxy_pass http://desktop_backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }
    location = /q/metrics { proxy_pass http://desktop_backend/q/metrics; }
    location /q/health { proxy_pass http://desktop_backend; }
    location = /monitoring { return 302 /monitoring/; }
    location /monitoring/ {
        proxy_pass http://desktop_monitoring;
        proxy_set_header Host $http_host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
    location = /openapi { proxy_pass http://desktop_backend/openapi; }
    location = /docs { return 302 /docs/; }
    location /docs/ { proxy_pass http://desktop_docs/; }
    location = /dashboard { return 302 /dashboard/; }
    location /dashboard/ {
        proxy_pass http://desktop_dashboard;
        proxy_set_header Host $http_host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
    location / { proxy_pass http://desktop_frontend; }
}
