apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
  labels:
    app: dataturntable
    component: kafka
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dataturntable
      component: kafka
  template:
    metadata:
      labels:
        app: dataturntable
        component: kafka
    spec:
      containers:
        - name: kafka
          image: apache/kafka:4.3.1
          env:
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
            - name: KAFKA_LISTENERS
              value: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093"
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "PLAINTEXT://kafka:9092"
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: "1@kafka:9093"
            - name: KAFKA_PROCESS_ROLES
              value: "broker,controller"
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: "CONTROLLER"
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
              value: "0"
            - name: CLUSTER_ID
              value: "MkU3OEVBNTcwNTJENDM2Qk"
            - name: KAFKA_LOG_DIRS
              value: "/var/lib/kafka/data"
          ports:
            - containerPort: 9092
              name: kafka
          resources:
            requests:
              cpu: 300m
              memory: 512Mi
            limits:
              cpu: 2
              memory: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  labels:
    app: dataturntable
spec:
  type: ClusterIP
  ports:
    - port: 9092
      targetPort: 9092
      protocol: TCP
      name: kafka
  selector:
    app: dataturntable
    component: kafka
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mosquitto-config
data:
  mosquitto.conf: |
    # Bundled MQTT broker (single-node deployments).
    # Mosquitto 2.x only accepts local connections unless listeners are configured.
    persistence true
    persistence_location /mosquitto/data/
    log_dest stdout

    listener 1883
    listener 9001
    protocol websockets

    # TODO: Provision broker users from the platform's broker credentials
    # Details: Broker credentials are stored by the platform but not yet pushed to the broker (e.g. via the Mosquitto dynamic-security plugin), so clients are accepted without authentication. Keep the broker ports inside the host/cluster network until provisioning is implemented.
    allow_anonymous true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mosquitto
  labels:
    app: dataturntable
    component: mosquitto
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dataturntable
      component: mosquitto
  template:
    metadata:
      labels:
        app: dataturntable
        component: mosquitto
    spec:
      volumes:
        - name: config
          configMap:
            name: mosquitto-config
      containers:
        - name: mosquitto
          image: eclipse-mosquitto:2.0.22
          volumeMounts:
            - name: config
              mountPath: /mosquitto/config/mosquitto.conf
              subPath: mosquitto.conf
          ports:
            - containerPort: 1883
              name: mqtt
            - containerPort: 9001
              name: websocket
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: mosquitto
  labels:
    app: dataturntable
spec:
  type: ClusterIP
  ports:
    - port: 1883
      targetPort: 1883
      protocol: TCP
      name: mqtt
    - port: 9001
      targetPort: 9001
      protocol: TCP
      name: websocket
  selector:
    app: dataturntable
    component: mosquitto
