# Voluntary disruptions (node drains, cluster upgrades) keep at least one replica of
# every component running.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: dataturntable-control-api
  labels:
    app: dataturntable
    component: control-api
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: dataturntable
      component: control-api
---
apiVersion: policy/v1
kind: PodDisruptionBudget
