apiVersion: apps/v1
kind: Deployment
metadata:
  name: dataturntable-backend
  labels:
    app: dataturntable
    component: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: dataturntable
      component: backend
  template:
    metadata:
      labels:
        app: dataturntable
        component: backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/q/metrics"
        prometheus.io/port: "8080"
    spec:
      containers:
        - name: backend
          image: dataturntable/backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: QUARKUS_PROFILE
              value: "prod"
            - name: DB_HOST
              value: "postgresql"
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: "dataturntable"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: dataturntable-secrets
                  key: db-user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dataturntable-secrets
                  key: db-password
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka:9092"
            - name: REDIS_HOSTS
              value: "redis://redis:6379"
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 2Gi
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: dataturntable-backend
  labels:
    app: dataturntable
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    app: dataturntable
    component: backend
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: dataturntable-backend-hpa
  labels:
    app: dataturntable
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: dataturntable-backend
  minReplicas: 2
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
