apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: dataturntable-ingest-edge
  labels:
    app: dataturntable
    component: ingest-edge
spec:
  replicas: 2
  # StatefulSet: every ingest pod keeps its spool volume across restarts (fire-and-forget
  # records Kafka could not take are replayed from it). Pods start and stop in parallel.
  serviceName: dataturntable-ingest-edge
  podManagementPolicy: Parallel
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: dataturntable
      component: ingest-edge
  template:
    metadata:
      labels:
        app: dataturntable
        component: ingest-edge
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/q/metrics"
        prometheus.io/port: "8080"
    spec:
      # Shutdown waits up to 50 s for the spool to drain (DATATURNTABLE_INGEST_SPOOL_DRAIN_TIMEOUT).
      terminationGracePeriodSeconds: 60
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: dataturntable
              component: ingest-edge
      # JWT signing/verification keys for every backend role. Without them no role can
      # verify a token, so the pods start and migrate but never pass /q/health/ready.
      volumes:
        - name: jwt-keys
          secret:
            secretName: dataturntable-jwt-keys
      containers:
        - name: ingest-edge
          image: dataturntable/backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: DATATURNTABLE_INGEST_SPOOL_DIR
              value: /var/lib/dataturntable/spool
            - name: DATATURNTABLE_INGEST_SPOOL_DRAIN_TIMEOUT
              value: 50s
            - name: QUARKUS_PROFILE
              value: "prod,ingest-edge"
            - name: DATATURNTABLE_RUNTIME_ROLE
              value: "ingest-edge"
            - name: DB_HOST
              value: "postgresql"
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: "dataturntable"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: app-db-credentials
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-db-credentials
                  key: password
            - name: DATATURNTABLE_PIPELINE_DATA_JDBC_URL
              value: jdbc:postgresql://pipeline-postgresql:5432/pipeline_data
            - name: DATATURNTABLE_PIPELINE_DATA_JDBC_USERNAME
              valueFrom:
                secretKeyRef:
                  name: pipeline-db-credentials
                  key: username
            - name: DATATURNTABLE_PIPELINE_DATA_JDBC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pipeline-db-credentials
                  key: password
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka:9092"
            # The backend requires these key locations (it has no default), and the
            # dataturntable-jwt-keys Secret mounted at /keys is the only thing that can
            # satisfy them. See docker/k8s/storage/secrets.yaml for how to populate it.
            - name: DATATURNTABLE_JWT_PUBLIC_KEY_LOCATION
              value: "file:///keys/public.pem"
            - name: DATATURNTABLE_JWT_SIGNING_KEY_LOCATION
              value: "file:///keys/signing.pem"
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              cpu: 1500m
              memory: 1536Mi
          lifecycle:
            # Let the Service stop routing to the pod before Quarkus starts its graceful shutdown.
            preStop:
              sleep:
                seconds: 5
          volumeMounts:
            - name: spool
              mountPath: /var/lib/dataturntable/spool
            - name: jwt-keys
              mountPath: /keys
              readOnly: true
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
  volumeClaimTemplates:
    - metadata:
        name: spool
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi

---
