apiVersion: apps/v1
kind: Deployment
metadata:
  name: dataturntable-control-api
  labels:
    app: dataturntable
    component: control-api
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: dataturntable
      component: control-api
  template:
    metadata:
      labels:
        app: dataturntable
        component: control-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/q/metrics"
        prometheus.io/port: "8080"
    spec:
      terminationGracePeriodSeconds: 30
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: dataturntable
              component: control-api
      # JWT signing/verification keys for every backend role. Without them no role can
      # verify a token, so the pods start and migrate but never pass /q/health/ready.
      volumes:
        - name: jwt-keys
          secret:
            secretName: dataturntable-jwt-keys
      containers:
        - name: control-api
          # The literal tag here is a placeholder identity for kustomization.yaml's `images:`
          # transformer (see its comment) — CI must override it with an immutable digest before a
          # real deploy; this file is never applied with `:latest` still in force in production.
          image: dataturntable/backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: QUARKUS_PROFILE
              value: "prod,control-api"
            - name: DATATURNTABLE_RUNTIME_ROLE
              value: "control-api"
            - name: DB_HOST
              value: "postgresql"
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: "dataturntable"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: app-db-credentials
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-db-credentials
                  key: password
            - name: DATATURNTABLE_PIPELINE_DATA_JDBC_URL
              value: jdbc:postgresql://pipeline-postgresql:5432/pipeline_data
            - name: DATATURNTABLE_PIPELINE_DATA_JDBC_USERNAME
              valueFrom:
                secretKeyRef:
                  name: pipeline-db-credentials
                  key: username
            - name: DATATURNTABLE_PIPELINE_DATA_JDBC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pipeline-db-credentials
                  key: password
            - name: DATATURNTABLE_GRAFANA_DASHBOARD_ENABLED
              value: "true"
            - name: DATATURNTABLE_GRAFANA_DASHBOARD_BASE_URL
              value: "http://dashboard-grafana:3000"
            - name: DATATURNTABLE_GRAFANA_DASHBOARD_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: dataturntable-secrets
                  key: grafana-dashboard-admin-user
                  optional: true # blank/missing safely disables Grafana provisioning rather than crash-looping the pod
            - name: DATATURNTABLE_GRAFANA_DASHBOARD_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dataturntable-secrets
                  key: grafana-dashboard-admin-password
                  optional: true
            - name: DATATURNTABLE_GRAFANA_DASHBOARD_DATASOURCE_HOST
              value: pipeline-postgresql
            - name: DATATURNTABLE_GRAFANA_DASHBOARD_DATASOURCE_PORT
              value: "5432"
            - name: DATATURNTABLE_GRAFANA_DASHBOARD_DATASOURCE_DATABASE
              value: pipeline_data
            - name: DATATURNTABLE_GRAFANA_DASHBOARD_DATASOURCE_USER
              valueFrom:
                secretKeyRef:
                  name: pipeline-db-credentials
                  key: username
            - name: DATATURNTABLE_GRAFANA_DASHBOARD_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pipeline-db-credentials
                  key: password
            - name: DATATURNTABLE_GRAFANA_MONITORING_ENABLED
              value: "true"
            - name: DATATURNTABLE_GRAFANA_MONITORING_BASE_URL
              value: "http://grafana:3000"
            - name: DATATURNTABLE_GRAFANA_MONITORING_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: dataturntable-secrets
                  key: grafana-monitoring-admin-user
                  optional: true # blank/missing safely disables Grafana provisioning rather than crash-looping the pod
            - name: DATATURNTABLE_GRAFANA_MONITORING_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dataturntable-secrets
                  key: grafana-monitoring-admin-password
                  optional: true
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka:9092"
            # The backend requires these key locations (it has no default), and the
            # dataturntable-jwt-keys Secret mounted at /keys is the only thing that can
            # satisfy them. See docker/k8s/storage/secrets.yaml for how to populate it.
            - name: DATATURNTABLE_JWT_PUBLIC_KEY_LOCATION
              value: "file:///keys/public.pem"
            - name: DATATURNTABLE_JWT_SIGNING_KEY_LOCATION
              value: "file:///keys/signing.pem"
          volumeMounts:
            - name: jwt-keys
              mountPath: /keys
              readOnly: true
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              cpu: 1500m
              memory: 1536Mi
          lifecycle:
            # Let the Service stop routing to the pod before Quarkus starts its graceful shutdown.
            preStop:
              sleep:
                seconds: 5
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: dataturntable-control-api
  labels:
    app: dataturntable
    component: control-api
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    app: dataturntable
    component: control-api
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: dataturntable-control-api-hpa
  labels:
    app: dataturntable
    component: control-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: dataturntable-control-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
---
