apiVersion: apps/v1
kind: Deployment
metadata:
  name: dataturntable-pipeline-executor
  labels:
    app: dataturntable
    component: pipeline-executor
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: dataturntable
      component: pipeline-executor
  template:
    metadata:
      labels:
        app: dataturntable
        component: pipeline-executor
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/q/metrics"
        prometheus.io/port: "8080"
    spec:
      terminationGracePeriodSeconds: 120
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: dataturntable
              component: pipeline-executor
      containers:
        - name: pipeline-executor
          # BUG: Pipeline modules cannot start Docker containers in this pod
          # Details: DockerService invokes the Docker CLI, but this deployment has no Docker socket/daemon or Kubernetes-native runner. Module execution will fail in Kubernetes; replace the Docker dependency with Jobs/Pods or provide a deliberately secured remote runner.
          image: dataturntable/backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: QUARKUS_PROFILE
              value: "prod,pipeline-executor"
            - name: DATATURNTABLE_RUNTIME_ROLE
              value: "pipeline-executor"
            - name: DB_HOST
              value: "postgresql"
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: "dataturntable"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: app-db-credentials
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-db-credentials
                  key: password
            - name: DATATURNTABLE_PIPELINE_DATA_JDBC_URL
              value: jdbc:postgresql://pipeline-postgresql:5432/pipeline_data
            - name: DATATURNTABLE_PIPELINE_DATA_JDBC_USERNAME
              valueFrom:
                secretKeyRef:
                  name: pipeline-db-credentials
                  key: username
            - name: DATATURNTABLE_PIPELINE_DATA_JDBC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pipeline-db-credentials
                  key: password
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka:9092"
          resources:
            requests:
              cpu: 500m
              memory: 768Mi
            limits:
              cpu: 2000m
              memory: 2048Mi
          lifecycle:
            # Let the Service stop routing to the pod before Quarkus starts its graceful shutdown.
            preStop:
              sleep:
                seconds: 5
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
