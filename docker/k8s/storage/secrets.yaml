# Database credentials, one basic-auth Secret per database, and the application Secret.
# The single-node PostgreSQL deployments and the CloudNativePG clusters of the HA overlay
# (docker/k8s-ha) both bootstrap from the database Secrets, and every client reads its
# credentials from them.
#
# This repository never ships credentials: the passwords are empty here. Supply them through
# a secret manager or an ignored environment-specific overlay before applying, e.g.
#   kubectl -n dataturntable create secret generic app-db-credentials \
#     --type=kubernetes.io/basic-auth --from-literal=username=dataturntable \
#     --from-literal=password="$(openssl rand -base64 24)" --dry-run=client -o yaml | kubectl apply -f -
apiVersion: v1
kind: Secret
metadata:
  name: app-db-credentials
type: kubernetes.io/basic-auth
stringData:
  username: dataturntable
  password: ""
---
apiVersion: v1
kind: Secret
metadata:
  name: pipeline-db-credentials
type: kubernetes.io/basic-auth
stringData:
  username: pipeline_data
  password: ""
---
apiVersion: v1
kind: Secret
metadata:
  name: monitoring-db-credentials
type: kubernetes.io/basic-auth
stringData:
  username: monitoring
  password: ""
---
apiVersion: v1
kind: Secret
metadata:
  name: dashboard-db-credentials
type: kubernetes.io/basic-auth
stringData:
  username: dashboard
  password: ""
---
apiVersion: v1
kind: Secret
metadata:
  name: dataturntable-secrets
  labels:
    app: dataturntable
type: Opaque
stringData: {}
# Optional keys referenced by docker/k8s/backend/deployment.yaml; omitting the Grafana
# admin credentials disables the corresponding Grafana provisioner instead of starting it
# with a default credential:
  # grafana-dashboard-admin-user, grafana-dashboard-admin-password
  #   grafana-monitoring-admin-user, grafana-monitoring-admin-password
---
# JWT signing/verification keys for the backend. The backend sets
# DATATURNTABLE_JWT_SIGNING_KEY_LOCATION and DATATURNTABLE_JWT_PUBLIC_KEY_LOCATION with no default,
# so every backend role (control-api, public-api, ingest-edge, pipeline-executor) mounts this Secret
# read-only at /keys and would not be able to verify a token without it. Docker Compose gets an
# equivalent throwaway pair from scripts/dev/generate-dev-keys.sh; this manifest is the Kubernetes
# side of the same requirement.
#
# Nothing is shipped: both keys are empty here. Fill them from a secret manager, or generate a
# throwaway pair for a non-production cluster with:
#   mkdir -p /tmp/jwt && ./scripts/dev/generate-dev-keys.sh
#   kubectl -n dataturntable create secret generic dataturntable-jwt-keys \
#     --from-file=signing.pem=/tmp/.../secrets/dev-keys/signing.pem \
#     --from-file=public.pem=/tmp/.../secrets/dev-keys/public.pem \
#     --dry-run=client -o yaml | kubectl apply -f -
# Until they are populated the pods start and Flyway migrates, but any token check fails at request
# time (SRJWT02003), so /q/health/ready will not go green.
apiVersion: v1
kind: Secret
metadata:
  name: dataturntable-jwt-keys
  labels:
    app: dataturntable
type: Opaque
stringData:
  signing.pem: ""
  public.pem: ""
