# Database credentials, one basic-auth Secret per database, and the application Secret.
# The single-node PostgreSQL deployments and the CloudNativePG clusters of the HA overlay
# (docker/k8s-ha) both bootstrap from the database Secrets, and every client reads its
# credentials from them.
#
# This repository never ships credentials: the passwords are empty here. Supply them through
# a secret manager or an ignored environment-specific overlay before applying, e.g.
#   kubectl -n dataturntable create secret generic app-db-credentials \
#     --type=kubernetes.io/basic-auth --from-literal=username=dataturntable \
#     --from-literal=password="$(openssl rand -base64 24)" --dry-run=client -o yaml | kubectl apply -f -
apiVersion: v1
kind: Secret
metadata:
  name: app-db-credentials
type: kubernetes.io/basic-auth
stringData:
  username: dataturntable
  password: ""
---
apiVersion: v1
kind: Secret
metadata:
  name: pipeline-db-credentials
type: kubernetes.io/basic-auth
stringData:
  username: pipeline_data
  password: ""
---
apiVersion: v1
kind: Secret
metadata:
  name: monitoring-db-credentials
type: kubernetes.io/basic-auth
stringData:
  username: monitoring
  password: ""
---
apiVersion: v1
kind: Secret
metadata:
  name: dashboard-db-credentials
type: kubernetes.io/basic-auth
stringData:
  username: dashboard
  password: ""
---
apiVersion: v1
kind: Secret
metadata:
  name: dataturntable-secrets
  labels:
    app: dataturntable
type: Opaque
stringData: {}
# Optional keys referenced by docker/k8s/backend/deployment.yaml; omitting the Grafana
# admin credentials disables the corresponding Grafana provisioner instead of starting it
# with a default credential:
#   grafana-dashboard-admin-user, grafana-dashboard-admin-password
#   grafana-monitoring-admin-user, grafana-monitoring-admin-password
