# Database credentials, one basic-auth Secret per database.
# The single-node PostgreSQL deployments and the CloudNativePG clusters of the
# HA overlay (docker/k8s-ha) both bootstrap from these Secrets, and every
# client reads its credentials from them.
#
# WARNING: Deployable placeholder secrets
# Details: `stringData` values are copied verbatim into the generated Secrets. Replace the passwords through a secret manager or an ignored environment-specific overlay before applying these manifests outside local development.
apiVersion: v1
kind: Secret
metadata:
  name: app-db-credentials
type: kubernetes.io/basic-auth
stringData:
  username: dataturntable
  password: changeme
---
apiVersion: v1
kind: Secret
metadata:
  name: pipeline-db-credentials
type: kubernetes.io/basic-auth
stringData:
  username: pipeline_data
  password: changeme-pipeline
---
apiVersion: v1
kind: Secret
metadata:
  name: monitoring-db-credentials
type: kubernetes.io/basic-auth
stringData:
  username: monitoring
  password: changeme-monitoring
---
apiVersion: v1
kind: Secret
metadata:
  name: dashboard-db-credentials
type: kubernetes.io/basic-auth
stringData:
  username: dashboard
  password: changeme-dashboard
