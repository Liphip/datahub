apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dataturntable-postgres
  labels:
    app: dataturntable
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi
  storageClassName: standard
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dataturntable-postgres
  labels:
    app: dataturntable
    component: database
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dataturntable
      component: database
  template:
    metadata:
      labels:
        app: dataturntable
        component: database
    spec:
      containers:
        - name: postgres
          image: timescale/timescaledb:2.17.2-pg16@sha256:4e459e217f00cbb09920c34d245501e63427e6767a495de57ce76823ff280f12
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: dataturntable-secrets
                  key: db-user
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dataturntable-secrets
                  key: db-password
            - name: POSTGRES_DB
              value: dataturntable
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 2000m
              memory: 4Gi
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - dataturntable
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - dataturntable
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: dataturntable-postgres
---
apiVersion: v1
kind: Service
metadata:
  name: postgresql
  labels:
    app: dataturntable
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
      protocol: TCP
      name: postgres
  selector:
    app: dataturntable
    component: database
---
