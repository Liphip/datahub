apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: dataturntable

resources:
  - backend/execution-rbac.yaml
  - backend/execution-network-policy.yaml
  - storage/secrets.yaml
  - storage/postgres.yaml
  - infra/messaging.yaml
  - backend/deployment.yaml
  - backend/pdb.yaml
  - frontend/deployment.yaml
  - docs/deployment.yaml
  - ingress/ingress.yaml
  - monitoring/prometheus.yaml
  - monitoring/loki.yaml
  - monitoring/alloy.yaml
  - monitoring/grafana.yaml
  - monitoring/infra-metrics.yaml

labels:
  - pairs:
      app: dataturntable
    includeSelectors: true

# FR-032/NFR-018: production manifests must resolve immutable digests, not `latest`.
# `dataturntable/backend`/`frontend`/`docs` here still name `:latest` as their base tag purely as
# a placeholder identity for kustomize's `images:` transformer to target — CI is expected to
# override every entry below with the real immutable digest for the image it just built and
# pushed (e.g. `kustomize edit set image dataturntable/backend=registry/dataturntable-backend@sha256:<digest>`)
# before this bundle is ever applied to a real cluster. No CI job does that yet (see
# docs/production-ready-v1-status.md — no image-build/push step exists), so this is a real,
# documented gap: the digests below are NOT populated and this bundle is not production-safe to
# apply as-is until that CI step exists and this file (or an overlay) is regenerated by it.
images:
  - name: dataturntable/backend
    newName: dataturntable/backend
    newTag: latest # CI MUST override with an immutable digest before a real deploy
  - name: dataturntable/frontend
    newName: dataturntable/frontend
    newTag: latest # CI MUST override with an immutable digest before a real deploy
  - name: dataturntable/docs
    newName: dataturntable/docs
    newTag: latest # CI MUST override with an immutable digest before a real deploy

