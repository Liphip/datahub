apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dataturntable-ingress
  labels:
    app: dataturntable
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    # For production, enable TLS
    # cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  rules:
    - host: dataturntable.example.com
      http:
        paths:
          - path: /api/internal
            pathType: Prefix
            backend:
              service:
                name: dataturntable-control-api
                port:
                  number: 8080
          - path: /api/ingest
            pathType: Prefix
            backend:
              service:
                name: dataturntable-ingest-edge
                port:
                  number: 8080
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: dataturntable-public-api
                port:
                  number: 8080
          - path: /dashboard
            pathType: Prefix
            backend:
              service:
                name: dashboard-grafana
                port:
                  number: 3000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dataturntable-frontend
                port:
                  number: 80
          - path: /q
            pathType: Prefix
            backend:
              service:
                name: dataturntable-public-api
                port:
                  number: 8080
    - host: monitoring.dataturntable.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: monitoring-grafana
                port:
                  number: 3000
    - host: dashboard.dataturntable.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dashboard-grafana
                port:
                  number: 3000
    - host: docs.dataturntable.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dataturntable-docs
                port:
                  number: 80
  # TLS configuration for production
  # tls:
  #   - hosts:
  #       - dataturntable.example.com
  #     secretName: dataturntable-tls
