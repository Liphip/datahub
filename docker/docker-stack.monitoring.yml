configs:
  prometheus_swrm_cfg:
    file: ./monitoring/prometheus/prometheus-swarm.yml
  loki_cfg:
    file: ./monitoring/loki/loki.yml
  alloy_cfg:
    file: ./monitoring/alloy/alloy-docker.hcl

volumes:
  prometheus-data:
  grafana-data:
  loki-data:

networks:
  dataturntable:
    external: true

services:
  prometheus:
    image: prom/prometheus:v3.14.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    ports:
      - target: 9090
        published: 9090
        protocol: tcp
        mode: ingress
    configs:
      - source: prometheus_swrm_cfg
        target: /etc/prometheus/prometheus.yml
    volumes:
      - prometheus-data:/prometheus
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - dataturntable
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager

  loki:
    image: grafana/loki:3.7.8
    command: -config.file=/etc/loki/loki.yml
    ports:
      - target: 3100
        published: 3100
        protocol: tcp
        mode: ingress
    configs:
      - source: loki_cfg
        target: /etc/loki/loki.yml
    volumes:
      - loki-data:/loki
    networks:
      - dataturntable
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager

  alloy:
    image: grafana/alloy:v1.19.2
    command: run /etc/alloy/config.alloy --storage.path=/var/lib/alloy/data
    configs:
      - source: alloy_cfg
        target: /etc/alloy/config.alloy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - dataturntable
    deploy:
      mode: global

  grafana:
    image: grafana/grafana:13.2.2
    ports:
      - target: 3000
        published: 3001
        protocol: tcp
        mode: ingress
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
    networks:
      - dataturntable
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager

  node-exporter:
    image: prom/node-exporter:v1.12.1
    command:
      - --path.rootfs=/host
    volumes:
      - /:/host:ro
    networks:
      - dataturntable
    deploy:
      mode: global

  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.6
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - dataturntable
    deploy:
      mode: global
