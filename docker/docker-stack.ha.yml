configs:
  nginx_cfg:
    file: ./nginx.conf
  frontend_nginx_cfg:
    file: ./frontend-nginx.conf

volumes:
  app-postgresql-0:
  app-postgresql-1:
  app-postgresql-2:
  pipeline-postgresql-0:
  pipeline-postgresql-1:
  pipeline-postgresql-2:
  monitoring-postgresql-0:
  monitoring-postgresql-1:
  monitoring-postgresql-2:
  dashboard-postgresql-0:
  dashboard-postgresql-1:
  dashboard-postgresql-2:
  kafka-0:
  kafka-1:
  kafka-2:
  grafana-data:
  dashboard-grafana-data:

networks:
  dataturntable:
    external: true

x-backend-common-env: &backend_common
  DB_HOST: app-pgpool
  DB_PORT: 5432
  DB_NAME: dataturntable
  DB_USER: dataturntable
  DB_PASSWORD: dataturntable
  DATATURNTABLE_PIPELINE_DATA_JDBC_URL: jdbc:postgresql://pipeline-pgpool:5432/pipeline_data
  DATATURNTABLE_PIPELINE_DATA_JDBC_USERNAME: pipeline_data
  DATATURNTABLE_PIPELINE_DATA_JDBC_PASSWORD: pipeline_data
  KAFKA_BOOTSTRAP_SERVERS: kafka-0:9092,kafka-1:9092,kafka-2:9092
  REDIS_HOSTS: redis://redis-ha:6379
  DATATURNTABLE_GRAFANA_DASHBOARD_ENABLED: "true"
  DATATURNTABLE_GRAFANA_DASHBOARD_BASE_URL: http://dashboard-grafana:3000
  DATATURNTABLE_GRAFANA_DASHBOARD_ADMIN_USER: admin
  DATATURNTABLE_GRAFANA_DASHBOARD_ADMIN_PASSWORD: admin
  DATATURNTABLE_GRAFANA_DASHBOARD_DATASOURCE_HOST: pipeline-pgpool
  DATATURNTABLE_GRAFANA_DASHBOARD_DATASOURCE_PORT: 5432
  DATATURNTABLE_GRAFANA_DASHBOARD_DATASOURCE_DATABASE: pipeline_data
  DATATURNTABLE_GRAFANA_DASHBOARD_DATASOURCE_USER: pipeline_data
  DATATURNTABLE_GRAFANA_DASHBOARD_DATASOURCE_PASSWORD: pipeline_data
  DATATURNTABLE_GRAFANA_MONITORING_ENABLED: "true"
  DATATURNTABLE_GRAFANA_MONITORING_BASE_URL: http://grafana:3000
  DATATURNTABLE_GRAFANA_MONITORING_ADMIN_USER: admin
  DATATURNTABLE_GRAFANA_MONITORING_ADMIN_PASSWORD: admin

services:
  app-postgresql-0:
    image: bitnami/postgresql-repmgr:16
    hostname: app-postgresql-0
    environment: &app_pg_env
      POSTGRESQL_POSTGRES_PASSWORD: postgres-admin
      POSTGRESQL_USERNAME: dataturntable
      POSTGRESQL_PASSWORD: dataturntable
      POSTGRESQL_DATABASE: dataturntable
      REPMGR_PASSWORD: repmgr-secret
      REPMGR_PRIMARY_HOST: app-postgresql-0
      REPMGR_PARTNER_NODES: app-postgresql-0,app-postgresql-1,app-postgresql-2
      REPMGR_NODE_NAME: app-postgresql-0
      REPMGR_NODE_NETWORK_NAME: app-postgresql-0
    volumes:
      - app-postgresql-0:/bitnami/postgresql
    networks:
      - dataturntable
    deploy:
      placement:
        constraints:
          - node.labels.db_app == true

  app-postgresql-1:
    image: bitnami/postgresql-repmgr:16
    hostname: app-postgresql-1
    environment:
      <<: *app_pg_env
      REPMGR_NODE_NAME: app-postgresql-1
      REPMGR_NODE_NETWORK_NAME: app-postgresql-1
    volumes:
      - app-postgresql-1:/bitnami/postgresql
    networks:
      - dataturntable
    deploy:
      placement:
        constraints:
          - node.labels.db_app_replica1 == true

  app-postgresql-2:
    image: bitnami/postgresql-repmgr:16
    hostname: app-postgresql-2
    environment:
      <<: *app_pg_env
      REPMGR_NODE_NAME: app-postgresql-2
      REPMGR_NODE_NETWORK_NAME: app-postgresql-2
    volumes:
      - app-postgresql-2:/bitnami/postgresql
    networks:
      - dataturntable
    deploy:
      placement:
        constraints:
          - node.labels.db_app_replica2 == true

  app-pgpool:
    image: bitnami/pgpool:4.5
    environment:
      PGPOOL_BACKEND_NODES: 0:app-postgresql-0:5432,1:app-postgresql-1:5432,2:app-postgresql-2:5432
      PGPOOL_POSTGRES_USERNAME: postgres
      PGPOOL_POSTGRES_PASSWORD: postgres-admin
      PGPOOL_ADMIN_USERNAME: admin
      PGPOOL_ADMIN_PASSWORD: admin
      PGPOOL_SR_CHECK_USER: repmgr
      PGPOOL_SR_CHECK_PASSWORD: repmgr-secret
      PGPOOL_ENABLE_LDAP: "no"
    networks:
      - dataturntable
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure

  pipeline-postgresql-0:
    image: bitnami/postgresql-repmgr:16
    hostname: pipeline-postgresql-0
    environment: &pipeline_pg_env
      POSTGRESQL_POSTGRES_PASSWORD: postgres-admin
      POSTGRESQL_USERNAME: pipeline_data
      POSTGRESQL_PASSWORD: pipeline_data
      POSTGRESQL_DATABASE: pipeline_data
      REPMGR_PASSWORD: repmgr-secret
      REPMGR_PRIMARY_HOST: pipeline-postgresql-0
      REPMGR_PARTNER_NODES: pipeline-postgresql-0,pipeline-postgresql-1,pipeline-postgresql-2
      REPMGR_NODE_NAME: pipeline-postgresql-0
      REPMGR_NODE_NETWORK_NAME: pipeline-postgresql-0
    volumes:
      - pipeline-postgresql-0:/bitnami/postgresql
    networks:
      - dataturntable

  pipeline-postgresql-1:
    image: bitnami/postgresql-repmgr:16
    hostname: pipeline-postgresql-1
    environment:
      <<: *pipeline_pg_env
      REPMGR_NODE_NAME: pipeline-postgresql-1
      REPMGR_NODE_NETWORK_NAME: pipeline-postgresql-1
    volumes:
      - pipeline-postgresql-1:/bitnami/postgresql
    networks:
      - dataturntable

  pipeline-postgresql-2:
    image: bitnami/postgresql-repmgr:16
    hostname: pipeline-postgresql-2
    environment:
      <<: *pipeline_pg_env
      REPMGR_NODE_NAME: pipeline-postgresql-2
      REPMGR_NODE_NETWORK_NAME: pipeline-postgresql-2
    volumes:
      - pipeline-postgresql-2:/bitnami/postgresql
    networks:
      - dataturntable

  pipeline-pgpool:
    image: bitnami/pgpool:4.5
    environment:
      PGPOOL_BACKEND_NODES: 0:pipeline-postgresql-0:5432,1:pipeline-postgresql-1:5432,2:pipeline-postgresql-2:5432
      PGPOOL_POSTGRES_USERNAME: postgres
      PGPOOL_POSTGRES_PASSWORD: postgres-admin
      PGPOOL_ADMIN_USERNAME: admin
      PGPOOL_ADMIN_PASSWORD: admin
      PGPOOL_SR_CHECK_USER: repmgr
      PGPOOL_SR_CHECK_PASSWORD: repmgr-secret
      PGPOOL_ENABLE_LDAP: "no"
    networks:
      - dataturntable
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure

  monitoring-postgresql-0:
    image: bitnami/postgresql-repmgr:16
    hostname: monitoring-postgresql-0
    environment: &monitoring_pg_env
      POSTGRESQL_POSTGRES_PASSWORD: postgres-admin
      POSTGRESQL_USERNAME: monitoring
      POSTGRESQL_PASSWORD: monitoring
      POSTGRESQL_DATABASE: monitoring
      REPMGR_PASSWORD: repmgr-secret
      REPMGR_PRIMARY_HOST: monitoring-postgresql-0
      REPMGR_PARTNER_NODES: monitoring-postgresql-0,monitoring-postgresql-1,monitoring-postgresql-2
      REPMGR_NODE_NAME: monitoring-postgresql-0
      REPMGR_NODE_NETWORK_NAME: monitoring-postgresql-0
    volumes:
      - monitoring-postgresql-0:/bitnami/postgresql
    networks:
      - dataturntable

  monitoring-postgresql-1:
    image: bitnami/postgresql-repmgr:16
    hostname: monitoring-postgresql-1
    environment:
      <<: *monitoring_pg_env
      REPMGR_NODE_NAME: monitoring-postgresql-1
      REPMGR_NODE_NETWORK_NAME: monitoring-postgresql-1
    volumes:
      - monitoring-postgresql-1:/bitnami/postgresql
    networks:
      - dataturntable

  monitoring-postgresql-2:
    image: bitnami/postgresql-repmgr:16
    hostname: monitoring-postgresql-2
    environment:
      <<: *monitoring_pg_env
      REPMGR_NODE_NAME: monitoring-postgresql-2
      REPMGR_NODE_NETWORK_NAME: monitoring-postgresql-2
    volumes:
      - monitoring-postgresql-2:/bitnami/postgresql
    networks:
      - dataturntable

  monitoring-pgpool:
    image: bitnami/pgpool:4.5
    environment:
      PGPOOL_BACKEND_NODES: 0:monitoring-postgresql-0:5432,1:monitoring-postgresql-1:5432,2:monitoring-postgresql-2:5432
      PGPOOL_POSTGRES_USERNAME: postgres
      PGPOOL_POSTGRES_PASSWORD: postgres-admin
      PGPOOL_ADMIN_USERNAME: admin
      PGPOOL_ADMIN_PASSWORD: admin
      PGPOOL_SR_CHECK_USER: repmgr
      PGPOOL_SR_CHECK_PASSWORD: repmgr-secret
      PGPOOL_ENABLE_LDAP: "no"
    networks:
      - dataturntable
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure

  dashboard-postgresql-0:
    image: bitnami/postgresql-repmgr:16
    hostname: dashboard-postgresql-0
    environment: &dashboard_pg_env
      POSTGRESQL_POSTGRES_PASSWORD: postgres-admin
      POSTGRESQL_USERNAME: dashboard
      POSTGRESQL_PASSWORD: dashboard
      POSTGRESQL_DATABASE: dashboard
      REPMGR_PASSWORD: repmgr-secret
      REPMGR_PRIMARY_HOST: dashboard-postgresql-0
      REPMGR_PARTNER_NODES: dashboard-postgresql-0,dashboard-postgresql-1,dashboard-postgresql-2
      REPMGR_NODE_NAME: dashboard-postgresql-0
      REPMGR_NODE_NETWORK_NAME: dashboard-postgresql-0
    volumes:
      - dashboard-postgresql-0:/bitnami/postgresql
    networks:
      - dataturntable

  dashboard-postgresql-1:
    image: bitnami/postgresql-repmgr:16
    hostname: dashboard-postgresql-1
    environment:
      <<: *dashboard_pg_env
      REPMGR_NODE_NAME: dashboard-postgresql-1
      REPMGR_NODE_NETWORK_NAME: dashboard-postgresql-1
    volumes:
      - dashboard-postgresql-1:/bitnami/postgresql
    networks:
      - dataturntable

  dashboard-postgresql-2:
    image: bitnami/postgresql-repmgr:16
    hostname: dashboard-postgresql-2
    environment:
      <<: *dashboard_pg_env
      REPMGR_NODE_NAME: dashboard-postgresql-2
      REPMGR_NODE_NETWORK_NAME: dashboard-postgresql-2
    volumes:
      - dashboard-postgresql-2:/bitnami/postgresql
    networks:
      - dataturntable

  dashboard-pgpool:
    image: bitnami/pgpool:4.5
    environment:
      PGPOOL_BACKEND_NODES: 0:dashboard-postgresql-0:5432,1:dashboard-postgresql-1:5432,2:dashboard-postgresql-2:5432
      PGPOOL_POSTGRES_USERNAME: postgres
      PGPOOL_POSTGRES_PASSWORD: postgres-admin
      PGPOOL_ADMIN_USERNAME: admin
      PGPOOL_ADMIN_PASSWORD: admin
      PGPOOL_SR_CHECK_USER: repmgr
      PGPOOL_SR_CHECK_PASSWORD: repmgr-secret
      PGPOOL_ENABLE_LDAP: "no"
    networks:
      - dataturntable
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure

  kafka-0:
    image: confluentinc/cp-kafka:7.6.1
    hostname: kafka-0
    environment: &kafka_env
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-0:9093,2@kafka-1:9093,3@kafka-2:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NODE_ID: 1
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-0:9092
    volumes:
      - kafka-0:/var/lib/kafka/data
    networks:
      - dataturntable

  kafka-1:
    image: confluentinc/cp-kafka:7.6.1
    hostname: kafka-1
    environment:
      <<: *kafka_env
      KAFKA_NODE_ID: 2
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-1:9092
    volumes:
      - kafka-1:/var/lib/kafka/data
    networks:
      - dataturntable

  kafka-2:
    image: confluentinc/cp-kafka:7.6.1
    hostname: kafka-2
    environment:
      <<: *kafka_env
      KAFKA_NODE_ID: 3
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-2:9092
    volumes:
      - kafka-2:/var/lib/kafka/data
    networks:
      - dataturntable

  emqx:
    image: emqx/emqx:5.7.1
    environment:
      EMQX_NAME: emqx
      EMQX_CLUSTER__DISCOVERY_STRATEGY: dns
      EMQX_CLUSTER__DNS__NAME: emqx
      EMQX_DASHBOARD__DEFAULT_USERNAME: admin
      EMQX_DASHBOARD__DEFAULT_PASSWORD: public
    ports:
      - target: 1883
        published: 1883
        protocol: tcp
        mode: ingress
      - target: 8083
        published: 8083
        protocol: tcp
        mode: ingress
      - target: 18083
        published: 18083
        protocol: tcp
        mode: ingress
    networks:
      - dataturntable
    deploy:
      replicas: 3
      endpoint_mode: dnsrr
      restart_policy:
        condition: on-failure

  control-api:
    image: dataturntable/backend:latest
    environment:
      <<: *backend_common
      QUARKUS_PROFILE: prod,control-api
      DATATURNTABLE_RUNTIME_ROLE: control-api
    networks:
      - dataturntable
    deploy:
      replicas: 2
      update_config:
        parallelism: 1
        delay: 10s
      restart_policy:
        condition: on-failure

  public-api:
    image: dataturntable/backend:latest
    environment:
      <<: *backend_common
      QUARKUS_PROFILE: prod,public-api
      DATATURNTABLE_RUNTIME_ROLE: public-api
    networks:
      - dataturntable
    deploy:
      replicas: 2
      update_config:
        parallelism: 1
        delay: 10s
      restart_policy:
        condition: on-failure

  ingest-edge:
    image: dataturntable/backend:latest
    environment:
      <<: *backend_common
      QUARKUS_PROFILE: prod,ingest-edge
      DATATURNTABLE_RUNTIME_ROLE: ingest-edge
    networks:
      - dataturntable
    deploy:
      replicas: 3
      update_config:
        parallelism: 1
        delay: 10s
      restart_policy:
        condition: on-failure

  pipeline-executor:
    # BUG: HA pipeline executor has no Docker runtime access
    # Details: DockerService requires a Docker daemon to execute module containers, while this service declares no socket mount or remote daemon. The HA deployment therefore cannot execute modules until a runner integration is supplied.
    image: dataturntable/backend:latest
    environment:
      <<: *backend_common
      QUARKUS_PROFILE: prod,pipeline-executor
      DATATURNTABLE_RUNTIME_ROLE: pipeline-executor
    networks:
      - dataturntable
    deploy:
      replicas: 3
      update_config:
        parallelism: 1
        delay: 10s
      restart_policy:
        condition: on-failure

  frontend:
    image: dataturntable/frontend:latest
    configs:
      - source: frontend_nginx_cfg
        target: /etc/nginx/conf.d/default.conf
    networks:
      - dataturntable
    deploy:
      replicas: 3

  docs:
    image: dataturntable/docs:latest
    networks:
      - dataturntable
    deploy:
      replicas: 2

  dashboard-grafana:
    image: grafana/grafana:11.1.4
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s/dashboard/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_DATABASE_TYPE: postgres
      GF_DATABASE_HOST: dashboard-pgpool:5432
      GF_DATABASE_NAME: dashboard
      GF_DATABASE_USER: dashboard
      GF_DATABASE_PASSWORD: dashboard
    volumes:
      - dashboard-grafana-data:/var/lib/grafana
    networks:
      - dataturntable
    deploy:
      replicas: 2

  grafana:
    image: grafana/grafana:11.1.4
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DATABASE_TYPE: postgres
      GF_DATABASE_HOST: monitoring-pgpool:5432
      GF_DATABASE_NAME: monitoring
      GF_DATABASE_USER: monitoring
      GF_DATABASE_PASSWORD: monitoring
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - dataturntable
    deploy:
      replicas: 2

  nginx:
    image: nginx:alpine
    configs:
      - source: nginx_cfg
        target: /etc/nginx/conf.d/default.conf
    ports:
      - target: 80
        published: 80
        protocol: tcp
        mode: ingress
    networks:
      - dataturntable
    deploy:
      replicas: 2

  redis-ha:
    image: bitnami/redis:7.4
    environment:
      ALLOW_EMPTY_PASSWORD: "yes"
      REDIS_REPLICATION_MODE: master
    networks:
      - dataturntable
    deploy:
      replicas: 1
