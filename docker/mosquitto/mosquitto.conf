# Bundled MQTT broker (single-node deployments).
# Mosquitto 2.x only accepts local connections unless listeners are configured.
persistence true
persistence_location /mosquitto/data/
log_dest stdout

# Platform connectors use persistent sessions. Queue messages for them while they are
# disconnected (restart, lease takeover), including QoS 0 messages of fire-and-forget devices.
queue_qos0_messages true
max_queued_messages 1000000
max_queued_bytes 0

listener 1883
listener 9001
protocol websockets

# TODO: Provision broker users from the platform's broker credentials
# Details: Broker credentials are stored by the platform but not yet pushed to the broker (e.g. via the Mosquitto dynamic-security plugin), so clients are accepted without authentication. Keep the broker ports inside the host/cluster network until provisioning is implemented.
allow_anonymous true
