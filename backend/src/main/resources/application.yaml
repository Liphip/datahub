quarkus:
  application:
    name: dataturntable
  smallrye-openapi:
    path: /openapi
    # FR-028: write the generated OpenAPI contract to a static file at build time so CI can lint
    # it (see .github/workflows/ci.yml's openapi-contract-lint job) without booting the app.
    store-schema-directory: target/generated-openapi
  http:
    port: 8080
    host: 0.0.0.0
    limits:
      max-body-size: 1M
  # Finish in-flight requests on SIGTERM (Kubernetes terminationGracePeriodSeconds is longer).
  shutdown:
    timeout: 20s
  
  datasource:
    db-kind: postgresql
  
  hibernate-orm:
    database:
      generation: none
    log:
      sql: false
  
  flyway:
    migrate-at-start: true
  
  # SMTP server used for EMAIL alert channels (set by the system administrators).
  # Username/password: QUARKUS_MAILER_USERNAME / QUARKUS_MAILER_PASSWORD. Dev and test profiles use a mock mailer.
  mailer:
    from: ${SMTP_FROM:dataturntable@localhost}
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:25}
    start-tls: ${SMTP_START_TLS:OPTIONAL}

  micrometer:
    export:
      prometheus:
        enabled: true
    binder:
      http-server:
        enabled: true

  # NFR-020: distributed tracing. Disabled (quarkus.otel.sdk.disabled=true) unless a deployment
  # sets DATATURNTABLE_OTEL_ENABLED=false and points DATATURNTABLE_OTEL_ENDPOINT at a real OTLP
  # collector — otherwise this is present-but-inert infrastructure with zero runtime behavior
  # change, since there is no collector to export to in most environments (including this repo's
  # own test/dev stacks).
  otel:
    sdk:
      disabled: ${DATATURNTABLE_OTEL_DISABLED:true}
    exporter:
      otlp:
        endpoint: ${DATATURNTABLE_OTEL_ENDPOINT:http://localhost:4317}

kafka:
  bootstrap:
    servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

mp:
  messaging:
    outgoing:
      # Durable hand-off of pipeline runs: PipelineRunQueue waits for this acknowledgement.
      pipeline-commands:
        connector: smallrye-kafka
        topic: dataturntable.pipelines.input
        bootstrap:
          servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
        key:
          serializer: org.apache.kafka.common.serialization.StringSerializer
        value:
          serializer: org.apache.kafka.common.serialization.StringSerializer
        acks: all
        enable:
          idempotence: true
        request:
          timeout:
            ms: 10000
        # Below dataturntable.kafka.send-timeout, so the producer gives up before the caller does.
        delivery:
          timeout:
            ms: 25000
    incoming:
      pipeline-input:
        connector: smallrye-kafka
        topic: dataturntable.pipelines.input
        bootstrap:
          servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
        group:
          id: dataturntable-pipeline-executor
          # KIP-848 consumer protocol: a failed executor's partitions move without stopping the others.
          protocol: consumer
        key:
          deserializer: org.apache.kafka.common.serialization.StringDeserializer
        value:
          deserializer: org.apache.kafka.common.serialization.StringDeserializer
        auto:
          offset:
            reset: earliest
        # Independent consumers per executor pod (each ordered); offsets are committed after processing.
        concurrency: ${PIPELINE_CONSUMER_CONCURRENCY:4}
        commit-strategy: throttled
        # Longer than max-infra-retry plus the longest module run, so a slow run is not reported unhealthy.
        throttled:
          unprocessed-record-max-age:
            ms: 1800000
        failure-strategy: dead-letter-queue
        dead-letter-queue:
          topic: dataturntable.pipelines.input.dlq
          key:
            serializer: org.apache.kafka.common.serialization.StringSerializer
          value:
            serializer: org.apache.kafka.common.serialization.StringSerializer
  jwt:
    verify:
      publickey:
        location: ${DATATURNTABLE_JWT_PUBLIC_KEY_LOCATION}
      issuer: https://dataturntable.io
    token:
      header: Authorization
      verification:
        key:
          location: ${DATATURNTABLE_JWT_PUBLIC_KEY_LOCATION}
      generation:
        key:
          location: ${DATATURNTABLE_JWT_SIGNING_KEY_LOCATION}

smallrye:
  jwt:
    sign:
      key:
        location: ${DATATURNTABLE_JWT_SIGNING_KEY_LOCATION}

jwt:
  issuer: https://dataturntable.io
  duration: 3600

dataturntable:
  alerts:
    enabled: true
    default-cooldown-seconds: ${DATATURNTABLE_ALERT_COOLDOWN_SECONDS:300}
  data:
    blob:
      max-upload-bytes: ${BLOB_MAX_UPLOAD_BYTES:1048576}
      max-tenant-bytes: ${BLOB_MAX_TENANT_BYTES:1073741824}
      failed-retention-days: ${BLOB_FAILED_RETENTION_DAYS:30}
  retention:
    # -1 (default) means indefinite retention — nothing is deleted until a deployment opts in.
    check-interval: ${DATATURNTABLE_RETENTION_CHECK_INTERVAL:24h}
    pipeline-runs-days: ${DATATURNTABLE_RETENTION_PIPELINE_RUNS_DAYS:-1}
    alert-history-days: ${DATATURNTABLE_RETENTION_ALERT_HISTORY_DAYS:-1}
    audit-events-days: ${DATATURNTABLE_RETENTION_AUDIT_EVENTS_DAYS:-1}
    readings-days: ${DATATURNTABLE_RETENTION_READINGS_DAYS:-1}
  runtime:
    role: ${DATATURNTABLE_RUNTIME_ROLE:all}
    instance-id: ${DATATURNTABLE_RUNTIME_INSTANCE_ID:}
  connectors:
    lease:
      ttl-seconds: ${DATATURNTABLE_CONNECTOR_LEASE_TTL_SECONDS:30}
      reconcile-interval-seconds: ${DATATURNTABLE_CONNECTOR_LEASE_RECONCILE_INTERVAL_SECONDS:10}
    file:
      # FILE connectors read and write only below this directory (a volume in Compose,
      # a ReadWriteMany volume on Kubernetes when several pods poll).
      base-dir: ${DATATURNTABLE_FILE_BASE_DIR:/data/files}
  grafana:
    dashboard:
      enabled: ${DATATURNTABLE_GRAFANA_DASHBOARD_ENABLED:false}
      base-url: ${DATATURNTABLE_GRAFANA_DASHBOARD_BASE_URL:http://dashboard-grafana:3000}
      # Enabling provisioning requires deployment-provided credentials; blanks
      # leave the target unconfigured.
      admin-user: ${DATATURNTABLE_GRAFANA_DASHBOARD_ADMIN_USER:}
      admin-password: ${DATATURNTABLE_GRAFANA_DASHBOARD_ADMIN_PASSWORD:}
      datasource:
        host: ${DATATURNTABLE_GRAFANA_DASHBOARD_DATASOURCE_HOST:}
        port: ${DATATURNTABLE_GRAFANA_DASHBOARD_DATASOURCE_PORT:5432}
        database: ${DATATURNTABLE_GRAFANA_DASHBOARD_DATASOURCE_DATABASE:}
        user: ${DATATURNTABLE_GRAFANA_DASHBOARD_DATASOURCE_USER:}
        password: ${DATATURNTABLE_GRAFANA_DASHBOARD_DATASOURCE_PASSWORD:}
        ssl-mode: ${DATATURNTABLE_GRAFANA_DASHBOARD_DATASOURCE_SSL_MODE:disable}
    monitoring:
      enabled: ${DATATURNTABLE_GRAFANA_MONITORING_ENABLED:false}
      base-url: ${DATATURNTABLE_GRAFANA_MONITORING_BASE_URL:http://grafana:3000}
      admin-user: ${DATATURNTABLE_GRAFANA_MONITORING_ADMIN_USER:}
      admin-password: ${DATATURNTABLE_GRAFANA_MONITORING_ADMIN_PASSWORD:}
  pipeline-data:
    jdbc:
      url: ${DATATURNTABLE_PIPELINE_DATA_JDBC_URL:}
      username: ${DATATURNTABLE_PIPELINE_DATA_JDBC_USERNAME:}
      password: ${DATATURNTABLE_PIPELINE_DATA_JDBC_PASSWORD:}
  ingest:
    # Durable fallback for records Kafka cannot take (fire-and-forget senders). On Kubernetes
    # a persistent volume of the ingest pod.
    spool-dir: ${DATATURNTABLE_INGEST_SPOOL_DIR:${java.io.tmpdir}/dataturntable-spool}
    websocket:
      idle-timeout-ms: ${DATATURNTABLE_INGEST_WEBSOCKET_IDLE_TIMEOUT_MS:300000}
      # How often the idle-session reaper scans for idle connections (see
      # WebSocketIngestResource.reapIdleSessions) — enforcement granularity is roughly this
      # interval, so keep it well under idle-timeout-ms.
      idle-reap-interval: ${DATATURNTABLE_INGEST_WEBSOCKET_IDLE_REAP_INTERVAL:10s}
  kafka:
    topics:
      prefix: dataturntable
      pipelines: pipelines
      system: system
      dead-letter: dead-letter
  docker:
    module:
      base-image: python:3.14.7-slim-trixie
      network: dataturntable
    resources:
      cpu-limit: "1.0"
      memory-limit: "512m"
  mqtt:
    # MQTT connectivity is handled via Eclipse Paho directly (MqttConnectionManager).
    # These values are exposed to the frontend as defaults for the connector setup UI only.
    integrated:
      internal-broker-url: ${MQTT_INTEGRATED_INTERNAL_BROKER_URL:mqtt://mosquitto:1883}
      external-broker-url: ${MQTT_INTEGRATED_EXTERNAL_BROKER_URL:mqtt://localhost:1883}
      websocket-url: ${MQTT_INTEGRATED_WEBSOCKET_URL:ws://localhost:9001}
      default-topic: ${MQTT_INTEGRATED_DEFAULT_TOPIC:dataturntable/events}
  pagination:
    default-size: 20
    max-size: 100

"%dev":
  quarkus:
    datasource:
      jdbc:
        url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:dataturntable}
      username: ${DB_USER:dataturntable}
      password: ${DB_PASSWORD:dataturntable}
    flyway:
      migrate-at-start: true
"%test":
  dataturntable:
    runtime:
      background-enabled: false
  quarkus:
    datasource:
      db-kind: h2
      jdbc:
        url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    flyway:
      migrate-at-start: false
    kafka:
      devservices:
        enabled: false
  mp:
    messaging:
      outgoing:
        pipeline-commands:
          connector: smallrye-in-memory
      incoming:
        pipeline-input:
          enabled: false

"%control-api":
  dataturntable:
    runtime:
      role: control-api
  mp:
    messaging:
      incoming:
        pipeline-input:
          enabled: false

"%public-api":
  dataturntable:
    runtime:
      role: public-api
  mp:
    messaging:
      incoming:
        pipeline-input:
          enabled: false

"%ingest-edge":
  dataturntable:
    runtime:
      role: ingest-edge
  mp:
    messaging:
      incoming:
        pipeline-input:
          enabled: false

"%pipeline-executor":
  dataturntable:
    runtime:
      role: pipeline-executor

"%prod":
  quarkus:
    datasource:
      jdbc:
        max-size: 20
        min-size: 5
      # Production credentials are mandatory and must come from the deployment secret store.
      username: ${DB_USER}
      password: ${DB_PASSWORD}
