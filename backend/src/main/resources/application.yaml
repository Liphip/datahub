quarkus:
  application:
    name: dataturntable
  http:
    port: 8080
    host: 0.0.0.0
  
  datasource:
    db-kind: postgresql
    jdbc:
      url: jdbc:postgresql://localhost:5432/dataturntable
    username: dataturntable
    password: dataturntable
  
  hibernate-orm:
    database:
      generation: none
    log:
      sql: false
  
  flyway:
    migrate-at-start: true
    baseline-on-migrate: true
  
  kafka:
    bootstrap:
      servers: localhost:9092
  
  redis:
    hosts: redis://localhost:6379
  
  security:
    users:
      embedded:
        enabled: false
  
  smallrye-jwt:
    enabled: true

mp:
  jwt:
    verify:
      publickey:
        location: publicKey.pem
      issuer: https://dataturntable.io

jwt:
  issuer: https://dataturntable.io
  duration: 3600

dataturntable:
  kafka:
    topics:
      prefix: dataturntable
      pipelines: pipelines
      system: system
      dead-letter: dead-letter
  docker:
    module:
      base-image: python:3.11-slim
      network: dataturntable
    resources:
      cpu-limit: "1.0"
      memory-limit: "512m"
  pagination:
    default-size: 20
    max-size: 100

"%dev":
  quarkus:
    datasource:
      jdbc:
        url: jdbc:postgresql://localhost:5432/dataturntable
    flyway:
      migrate-at-start: true

"%test":
  quarkus:
    datasource:
      db-kind: h2
      jdbc:
        url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    flyway:
      migrate-at-start: false

"%prod":
  quarkus:
    datasource:
      jdbc:
        url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:dataturntable}
        max-size: 20
        min-size: 5
    kafka:
      bootstrap:
        servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    redis:
      hosts: ${REDIS_HOSTS:redis://localhost:6379}
