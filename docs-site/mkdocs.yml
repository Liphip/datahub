site_name: DataTurntable Documentation
site_description: End-user and administrator documentation for DataTurntable
site_url: https://docs.dataturntable.local

theme:
  name: material
  language: en
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - scheme: default
      primary: cyan
      accent: blue

plugins:
  - search

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Developers:
      - Requirements Specification: reference/specification/requirements-specification.md
      - Functional Specification: reference/specification/functional-specification.md
      - Development Setup: reference/development/setup.md
      - Configuration Reference: reference/development/configuration-reference.md
      - API Reference: reference/api/README.md
      - Source-code Reference: reference/development/source-reference.md
      - Source Function Reference: reference/development/source-function-reference.md
      - Licences: reference/development/licenses.md
      - Backup and Restore: reference/operations/backup-restore.md
      - "Example: §14a EnWG": reference/examples/energy-14a/README.md
  - English:
      - Getting Started: en/getting-started.md
      - Beginner Guide: en/beginner-guide.md
      - UI Controls Reference: en/ui-controls.md
      - Step-by-Step Tasks: en/guided-tasks.md
      - Administrator Guide: en/admin-guide.md
      - Tenants and Roles: en/tenants-and-roles.md
      - Modules: en/modules.md
      - Pipelines: en/pipelines.md
      - Data Explorer: en/data-explorer.md
      - Connectors and Alerts: en/connectors-alerts.md
      - Security Basics: en/security.md
      - Backup and Recovery: en/backup-recovery.md
      - Monitoring and Logging: en/monitoring-logging.md
      - Operations Runbook: en/operations-runbook.md
      - Troubleshooting: en/troubleshooting.md
      - Glossary: en/glossary.md
      - FAQ: en/faq.md
  - Deutsch:
      - Erste Schritte: de/getting-started.md
      - Einsteiger-Guide: de/beginner-guide.md
      - UI-Bedienreferenz: de/ui-controls.md
      - Schritt-fuer-Schritt Aufgaben: de/guided-tasks.md
      - Administratoren-Guide: de/admin-guide.md
      - Mandanten und Rollen: de/tenants-and-roles.md
      - Module: de/modules.md
      - Pipelines: de/pipelines.md
      - Daten-Explorer: de/data-explorer.md
      - Konnektoren und Alarme: de/connectors-alerts.md
      - Sicherheitsgrundlagen: de/security.md
      - Backup und Wiederherstellung: de/backup-recovery.md
      - Monitoring und Logging: de/monitoring-logging.md
      - Betriebs-Runbook: de/operations-runbook.md
      - Troubleshooting: de/troubleshooting.md
      - Glossar: de/glossary.md
      - FAQ: de/faq.md
